# Minimal Mistakes Theme
# https://mmistakes.github.io/minimal-mistakes/docs/configuration/
remote_theme: mmistakes/minimal-mistakes

# Skins: default, air, aqua, contrast, dark, dirt, mint, neon, plum, sunrise
# https://mmistakes.github.io/minimal-mistakes/docs/configuration/#skin
minimal_mistakes_skin: "dark"

# Site Settings
# https://mmistakes.github.io/minimal-mistakes/docs/configuration/#site-settings
locale: "en-US"
title: "Tom Pounders"
subtitle: "Building Internet systems since before the cloud existed"
name: "Tom Pounders"
description: >-
  The public notebook of an old-school engineer — three decades across
  the U.S. Navy, Microsoft, Amazon/AWS, and ServiceNow. System
  architecture, security and identity, trading systems, and whatever
  rabbit hole comes next.
url: "https://oldschool-engineer.dev"
baseurl: ""

# Author (shown in sidebar)
# https://mmistakes.github.io/minimal-mistakes/docs/authors/
author:
  name: "Tom Pounders"
  bio: >-
    Old-school engineer. Three decades: U.S. Navy, Microsoft,
    Amazon/AWS, and ServiceNow. Building and operating Internet
    systems at planetary scale. Opinions are my own; nothing here
    is professional advice.
  # Icon names from Font Awesome 5: https://fontawesome.com/v5/search
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/oldschool-engineer"
    - label: "Kuhl Haus"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/kuhl-haus"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/thomaspounders"
    - label: "Blog"
      icon: "fas fa-fw fa-pen-nib"
      url: "https://oldschool-engineer.dev/blog"
    - label: "Medium"
      icon: "fab fa-fw fa-medium"
      url: "https://the.oldschool.engineer"

# Footer
# https://mmistakes.github.io/minimal-mistakes/docs/configuration/#site-footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/oldschool-engineer"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/thomaspounders"
    - label: "Blog"
      icon: "fas fa-fw fa-pen-nib"
      url: "https://oldschool-engineer.dev/blog"
    - label: "Medium"
      icon: "fab fa-fw fa-medium"
      url: "https://the.oldschool.engineer"

# Atom feed (RSS) — generates /feed.xml automatically from Jekyll posts
# https://github.com/jekyll/jekyll-feed
atom_feed:
  hide: false

# Plugins
# GitHub Pages supported plugins: https://pages.github.com/versions/
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from Jekyll build — .github contains agent instructions and
# other repo metadata that should not be processed as site pages.
# https://jekyllrb.com/docs/configuration/options/#global-configuration
exclude:
  - .github
  - CLAUDE.md

# Search — client-side via Lunr.js, no server required
# https://mmistakes.github.io/minimal-mistakes/docs/configuration/#site-search
search: true
search_full_content: true

# Front matter defaults — apply layout and options without requiring
# front matter in each file. README.md specifically must not have front
# matter or it will render as raw text on the GitHub profile.
# https://jekyllrb.com/docs/configuration/front-matter-defaults/
# https://mmistakes.github.io/minimal-mistakes/docs/configuration/#front-matter-defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "single"
      author_profile: true
      toc: true
      toc_sticky: true
  - scope:
      path: "README.md"
    values:
      title: " "
  # Post defaults — these values apply to all files in _posts/
  # https://mmistakes.github.io/minimal-mistakes/docs/posts/
  #
  # Canonical URLs: jekyll-seo-tag automatically generates
  # <link rel="canonical"> using site.url + page.url for every post.
  # To override on a specific post, add to its front matter:
  #   canonical_url: "https://some-other-url.com/original-post"
  # When cross-posting to Medium, use their import tool — it reads
  # the canonical tag from the source and sets it automatically.
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      share: true
      related: true
      toc: true
      toc_sticky: true
